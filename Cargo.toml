[package]
name = "annotale-rs"
version = "0.1.0"
edition = "2021"

# Package was renamed to annotale-rs (commit fc5f414) but all bins still
# import `rust_annotale::`; keep the old lib name so the workspace builds.
[lib]
name = "rust_annotale"

[dependencies]
anyhow = "1.0.102"
bio = "3.0.0"
hmmer-pure-rs = "0.7.4"
rayon = "1.10.0"
clap = { version = "4.6.1", features = ["derive"] }
strsim = "0.11.1"
flate2 = "1.0.35"



